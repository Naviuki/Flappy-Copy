name: Tests

# Runs the EditMode suite of the project on every push and pull request.
# Needs the same Unity secrets as the Release workflow (see .github/workflows/release.yml).

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  UNITY_VERSION: 6000.5.1f1

jobs:
  editmode:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-tests-${{ hashFiles('Packages/packages-lock.json') }}
      - name: Validate the project and run the tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: Logs/harness
